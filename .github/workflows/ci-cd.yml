
name: Cloud File Storage CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Test Application
        run: |
          python -c "from app import app; print('App imported successfully')"

      - name: Build Docker Image
        run: docker build -t cloud-file-storage .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloud-file-storage:latest

      - name: Deploy to AWS EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cloud-file-storage:latest
            sudo docker stop cloud-storage || true
            sudo docker rm cloud-storage || true
            sudo docker run -d --restart unless-stopped --name cloud-storage -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/cloud-file-storage:latest
            sleep 5
            curl -f http://localhost:5000/health